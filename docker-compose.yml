version: '3.8'

services:
  # PostgreSQL with PostGIS
  postgres:
    image: postgis/postgis:16-3.4
    container_name: openmaas-postgres
    environment:
      POSTGRES_USER: openmaas
      POSTGRES_PASSWORD: openmaas-dev
      POSTGRES_DB: openmaas
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - openmaas-network

  # Redis for caching
  redis:
    image: redis:7-alpine
    container_name: openmaas-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - openmaas-network

  # Keycloak for authentication
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: openmaas-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: openmaas
      KC_DB_PASSWORD: openmaas-dev
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    command: start-dev
    networks:
      - openmaas-network

  # Kong API Gateway
  kong-database:
    image: postgres:16-alpine
    container_name: openmaas-kong-db
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong-dev
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    networks:
      - openmaas-network

  kong-migration:
    image: kong:3.5
    container_name: openmaas-kong-migration
    depends_on:
      - kong-database
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong-dev
    command: kong migrations bootstrap
    restart: on-failure
    networks:
      - openmaas-network

  kong:
    image: kong:3.5
    container_name: openmaas-kong
    depends_on:
      - kong-database
      - kong-migration
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong-dev
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000" # Proxy
      - "8001:8001" # Admin API
    networks:
      - openmaas-network

  # OpenTripPlanner (OTP)
  otp:
    image: opentripplanner/opentripplanner:2.4.0
    container_name: openmaas-otp
    ports:
      - "8090:8080"
    volumes:
      - ./data/otp:/var/opentripplanner
    command: --load --serve
    networks:
      - openmaas-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    container_name: openmaas-user-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: openmaas
      DATABASE_PASSWORD: openmaas-dev
      DATABASE_NAME: openmaas
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-in-production}
      KEYCLOAK_URL: http://keycloak:8080
      REDIS_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      - postgres
      - redis
      - keycloak
    networks:
      - openmaas-network
    profiles:
      - services

  # Development database admin tool
  adminer:
    image: adminer:latest
    container_name: openmaas-adminer
    ports:
      - "8082:8080"
    networks:
      - openmaas-network
    profiles:
      - dev

volumes:
  postgres-data:
  redis-data:
  kong-db-data:

networks:
  openmaas-network:
    driver: bridge