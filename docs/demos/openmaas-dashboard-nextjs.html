<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenMaaS Dashboard - Next.js実装</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    animation: {
                        'fade-in-up': 'fadeInUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' }
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .card-hover:hover {
            transform: translateY(-2px);
            transition: transform 0.2s ease-in-out;
        }
        .stagger-item {
            animation: fadeInUp 0.6s ease-out forwards;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect } = React;
        
        // UI Components (shadcn/ui style)
        const Card = ({ children, className = "" }) => (
            <div className={`bg-white rounded-lg border shadow-sm ${className}`}>
                {children}
            </div>
        );
        
        const CardHeader = ({ children, className = "" }) => (
            <div className={`flex flex-col space-y-1.5 p-6 ${className}`}>
                {children}
            </div>
        );
        
        const CardTitle = ({ children, className = "" }) => (
            <h3 className={`text-2xl font-semibold leading-none tracking-tight ${className}`}>
                {children}
            </h3>
        );
        
        const CardContent = ({ children, className = "" }) => (
            <div className={`p-6 pt-0 ${className}`}>
                {children}
            </div>
        );
        
        const Button = ({ children, className = "", onClick }) => (
            <button 
                className={`inline-flex items-center justify-center rounded-md text-sm font-medium ring-offset-background transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring focus-visible:ring-offset-2 disabled:pointer-events-none disabled:opacity-50 bg-primary text-primary-foreground hover:bg-primary/90 h-10 px-4 py-2 bg-blue-600 text-white hover:bg-blue-700 ${className}`}
                onClick={onClick}
            >
                {children}
            </button>
        );
        
        const Badge = ({ children, variant = "default", className = "" }) => {
            const variants = {
                default: "bg-blue-100 text-blue-800",
                destructive: "bg-red-100 text-red-800",
                secondary: "bg-gray-100 text-gray-800"
            };
            
            return (
                <span className={`inline-flex items-center rounded-full border px-2.5 py-0.5 text-xs font-semibold transition-colors focus:outline-none focus:ring-2 focus:ring-ring focus:ring-offset-2 ${variants[variant]} ${className}`}>
                    {children}
                </span>
            );
        };
        
        const Progress = ({ value = 0, className = "" }) => (
            <div className={`relative h-4 w-full overflow-hidden rounded-full bg-secondary bg-gray-200 ${className}`}>
                <div 
                    className="h-full w-full flex-1 bg-primary transition-all bg-blue-600"
                    style={{ transform: `translateX(-${100 - value}%)` }}
                />
            </div>
        );
        
        // Icon Components
        const IconMap = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 01.553-.894L9 2l6 3 6-3v15l-6 3-6-3z"/>
            </svg>
        );
        
        const IconCalendar = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
        );
        
        const IconClock = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        );
        
        const IconTrendingUp = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"/>
            </svg>
        );
        
        const IconTrain = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
        );
        
        const IconBus = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
        );
        
        const IconZap = ({ className = "w-4 h-4" }) => (
            <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
            </svg>
        );
        
        // Main Dashboard Component (実際のNext.js実装)
        function DashboardPage() {
            const [currentTime, setCurrentTime] = useState(new Date());
            const [transitStatus] = useState([
                { line: 'JR山手線', status: 'normal', delay: 0 },
                { line: '東京メトロ銀座線', status: 'delay', delay: 5 },
                { line: '都営大江戸線', status: 'normal', delay: 0 },
            ]);

            useEffect(() => {
                const timer = setInterval(() => {
                    setCurrentTime(new Date());
                }, 1000);

                return () => clearInterval(timer);
            }, []);

            const getIcon = (mode) => {
                switch (mode) {
                    case '電車': return <IconTrain className="w-4 h-4" />;
                    case 'バス': return <IconBus className="w-4 h-4" />;
                    default: return <IconTrain className="w-4 h-4" />;
                }
            };

            return (
                <div className="container mx-auto p-4 sm:p-6 space-y-4 sm:space-y-6">
                    {/* Header */}
                    <div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                        <div>
                            <h1 className="text-2xl sm:text-3xl font-bold tracking-tight">OpenMaaS ダッシュボード</h1>
                            <p className="text-sm text-gray-600">
                                {currentTime.toLocaleDateString('ja-JP')} {currentTime.toLocaleTimeString('ja-JP')}
                            </p>
                            <p className="text-xs text-blue-600 mt-1">Next.js + React + TypeScript + Tailwind CSS</p>
                        </div>
                        <Button onClick={() => alert('新しい旅行を計画機能 (Next.js Component)')}>
                            <IconMap className="mr-2 h-4 w-4" />
                            <span className="sm:hidden">旅行を計画</span>
                            <span className="hidden sm:inline">新しい旅行を計画</span>
                        </Button>
                    </div>

                    {/* Stats Cards */}
                    <div className="grid gap-3 sm:gap-4 grid-cols-2 lg:grid-cols-4">
                        <Card className="stagger-item card-hover">
                            <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-2">
                                <CardTitle className="text-xs sm:text-sm font-medium">今月の旅行</CardTitle>
                                <IconCalendar className="h-3 w-3 sm:h-4 sm:w-4 text-gray-400" />
                            </CardHeader>
                            <CardContent>
                                <div className="text-xl sm:text-2xl font-bold">12</div>
                                <p className="text-xs text-gray-500">先月から +20.1%</p>
                            </CardContent>
                        </Card>
                        
                        <Card className="stagger-item card-hover">
                            <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-2">
                                <CardTitle className="text-xs sm:text-sm font-medium">移動時間削減</CardTitle>
                                <IconClock className="h-3 w-3 sm:h-4 sm:w-4 text-gray-400" />
                            </CardHeader>
                            <CardContent>
                                <div className="text-xl sm:text-2xl font-bold">2.5時間</div>
                                <p className="text-xs text-gray-500">効率的なルート選択により</p>
                            </CardContent>
                        </Card>
                        
                        <Card className="stagger-item card-hover">
                            <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-2">
                                <CardTitle className="text-xs sm:text-sm font-medium">CO2削減量</CardTitle>
                                <IconTrendingUp className="h-3 w-3 sm:h-4 sm:w-4 text-gray-400" />
                            </CardHeader>
                            <CardContent>
                                <div className="text-xl sm:text-2xl font-bold">15.2kg</div>
                                <p className="text-xs text-gray-500">公共交通機関の利用で</p>
                            </CardContent>
                        </Card>
                        
                        <Card className="stagger-item card-hover">
                            <CardHeader className="flex flex-row items-center justify-between space-y-0 pb-2">
                                <CardTitle className="text-xs sm:text-sm font-medium">節約金額</CardTitle>
                                <IconTrendingUp className="h-3 w-3 sm:h-4 sm:w-4 text-gray-400" />
                            </CardHeader>
                            <CardContent>
                                <div className="text-xl sm:text-2xl font-bold">¥8,400</div>
                                <p className="text-xs text-gray-500">最適化されたルートで</p>
                            </CardContent>
                        </Card>
                    </div>

                    {/* Real-time Transit Status */}
                    <Card>
                        <CardHeader>
                            <CardTitle className="text-lg sm:text-xl flex items-center gap-2">
                                <IconZap className="h-5 w-5" />
                                リアルタイム交通情報
                            </CardTitle>
                            <p className="text-sm text-gray-600">主要路線の運行状況</p>
                        </CardHeader>
                        <CardContent>
                            <div className="space-y-3">
                                {transitStatus.map((line, i) => (
                                    <div key={i} className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                        <div className="flex items-center gap-3">
                                            <IconTrain className="h-4 w-4 text-gray-600" />
                                            <span className="font-medium">{line.line}</span>
                                        </div>
                                        <div className="flex items-center gap-2">
                                            <Badge 
                                                variant={line.status === 'normal' ? 'default' : 'destructive'}
                                                className="text-xs"
                                            >
                                                {line.status === 'normal' ? '正常運行' : `${line.delay}分遅延`}
                                            </Badge>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </CardContent>
                    </Card>

                    {/* Recent Activity */}
                    <div className="grid gap-4 lg:grid-cols-7">
                        <Card className="lg:col-span-4">
                            <CardHeader>
                                <CardTitle className="text-lg sm:text-xl">最近の旅行</CardTitle>
                                <p className="text-sm text-gray-600">最近完了した旅行の一覧です</p>
                            </CardHeader>
                            <CardContent>
                                <div className="space-y-4">
                                    {[
                                        { from: '渋谷駅', to: '東京駅', time: '今日 14:30', mode: '電車', cost: '¥160', duration: '24分' },
                                        { from: '新宿駅', to: '品川駅', time: '昨日 09:15', mode: '電車', cost: '¥200', duration: '18分' },
                                        { from: '六本木', to: '銀座', time: '昨日 20:45', mode: 'バス', cost: '¥220', duration: '25分' },
                                    ].map((trip, i) => (
                                        <div 
                                            key={i} 
                                            className="flex items-center space-x-4 p-3 rounded-lg hover:bg-gray-50 transition-colors cursor-pointer"
                                            onClick={() => alert(`${trip.from} → ${trip.to} の詳細 (React Component)`)}
                                        >
                                            <div className={`flex items-center justify-center w-10 h-10 rounded-full ${trip.mode === '電車' ? 'bg-blue-100' : 'bg-green-100'}`}>
                                                {getIcon(trip.mode)}
                                            </div>
                                            <div className="min-w-0 flex-1">
                                                <p className="text-sm font-medium truncate">
                                                    {trip.from} → {trip.to}
                                                </p>
                                                <p className="text-sm text-gray-500">
                                                    {trip.time} • {trip.duration}
                                                </p>
                                            </div>
                                            <div className="text-right">
                                                <p className="text-sm font-medium">{trip.cost}</p>
                                                <p className="text-xs text-gray-500">{trip.mode}</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </CardContent>
                        </Card>

                        <Card className="lg:col-span-3">
                            <CardHeader>
                                <CardTitle className="text-lg sm:text-xl">今週の予定</CardTitle>
                                <p className="text-sm text-gray-600">予約済みの旅行</p>
                            </CardHeader>
                            <CardContent>
                                <div className="space-y-4">
                                    {[
                                        { title: '出張', date: '明日 08:00', destination: '大阪', type: 'business', status: 'confirmed' },
                                        { title: '会議', date: '金曜 15:30', destination: '横浜', type: 'meeting', status: 'pending' },
                                        { title: '家族旅行', date: '土曜 10:00', destination: '鎌倉', type: 'leisure', status: 'confirmed' },
                                    ].map((event, i) => (
                                        <div key={i} className="p-3 rounded-lg border border-gray-200 space-y-2">
                                            <div className="flex items-center justify-between">
                                                <p className="text-sm font-medium">{event.title}</p>
                                                <Badge 
                                                    variant={event.status === 'confirmed' ? 'default' : 'secondary'}
                                                    className="text-xs"
                                                >
                                                    {event.status === 'confirmed' ? '確定' : '保留中'}
                                                </Badge>
                                            </div>
                                            <p className="text-xs text-gray-500">
                                                {event.date} • {event.destination}
                                            </p>
                                            <div className="flex items-center gap-2">
                                                <Progress 
                                                    value={event.status === 'confirmed' ? 100 : 50} 
                                                    className="h-1 flex-1"
                                                />
                                                <span className="text-xs text-gray-500">
                                                    {event.status === 'confirmed' ? '準備完了' : '計画中'}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </CardContent>
                        </Card>
                    </div>
                </div>
            );
        }

        // Render the Next.js-style application
        ReactDOM.render(<DashboardPage />, document.getElementById('root'));
        
        // Add stagger animation delays
        setTimeout(() => {
            document.querySelectorAll('.stagger-item').forEach((item, index) => {
                item.style.animationDelay = `${index * 0.1}s`;
            });
        }, 100);
    </script>
</body>
</html>
