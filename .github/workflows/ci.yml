name: Platform CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm run config:validate -- examples/platform/event-transit.json
      - run: npm run config:validate -- examples/platform/tourism.json
      - run: npm run config:validate -- examples/platform/local-transit.json
      - run: npm run config:validate -- examples/platform/ticket-sales.json
